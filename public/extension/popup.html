<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css">

</head>

<body>

  <div class="header">
    <img src="rasul_allah.png" alt="رسول الله" class="header-logo">
  </div>

  <div class="body">

    <!-- total count -->
    <div class="count-wrap">
      <div class="count-label">إجمالي الصلوات</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="count-value" id="countValue">0</div>
        <button class="reset-btn" id="resetBtn" title="إعادة العد">↺</button>
      </div>
    </div>

    <!-- volume -->
    <div class="vol-wrap">
      <div class="row-label">مستوى الصوت</div>
      <div class="vol-row">
        <span class="vol-icon" id="volIcon">🔊</span>
        <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
      </div>
    </div>

    <!-- audio format -->
    <div class="select-wrap">
      <div class="row-label">صيغة التذكير</div>
      <div class="custom-select" id="audioSelectWrap">
        <div class="custom-select__trigger" id="audioSelectTrigger">
          <span class="custom-select__text" id="audioSelectText"></span>
          <svg class="custom-select__arrow" width="10" height="6" viewBox="0 0 10 6">
            <path d="M0 0l5 6 5-6z" fill="#1A5F5A" />
          </svg>
        </div>
        <div class="custom-select__options" id="audioSelectOptions"></div>
      </div>
    </div>

    <!-- timer -->
    <div class="select-wrap">
      <div class="row-label">تنبيه كل</div>
      <select id="timer">
        <option value="0">إيقاف</option>
        <option value="300000">5 دقائق</option>
        <option value="600000">10 دقائق</option>
        <option value="1800000">٣٠ دقيقة</option>
        <option value="3600000">ساعة</option>
        <option value="7200000">ساعتين</option>
        <option value="custom">موعد مخصص...</option>
      </select>
    </div>

    <!-- custom timer input -->
    <div id="customTimerWrap" class="select-wrap" style="display: none;">
      <div class="row-label">دقائق مخصصة</div>
      <div class="custom-input-row">
        <input type="number" id="customMinutes" min="1" placeholder="مثلاً: 7">
        <span class="input-unit">دقيقة</span>
      </div>
    </div>

    <!-- new tab -->
    <label class="check-wrap">
      <input type="checkbox" id="playNewTab">
      <span class="custom-check"></span>
      <span class="check-label">صوت عند فتح تبويب جديد</span>
    </label>

  </div>

  <div class="footer"></div>

  <script type="module" src="popup.js"></script>
</body>

</html>
